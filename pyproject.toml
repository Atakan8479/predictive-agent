[project]
name = "predictive-agent"
version = "0.1.0"
description = "Event-driven, async LLM agent orchestration with predictive tool prefetching"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
pa-doctor = "predictive_agent.doctor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predictive_agent"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "mocks", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # bugbear
  "UP",       # pyupgrade
  "ASYNC",    # async pitfalls (blocking calls in async code, etc.)
  "SIM",      # simplifications
  "RUF",      # ruff-specific
  "PT",       # pytest style
]
# Turkish prompts and fixtures legitimately use the dotless i.
allowed-confusables = ["ı"]

# ---------------------------------------------------------------- pyright
[tool.pyright]
include = ["src", "mocks", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
